stages:
  - validate

validate:
  stage: validate
  image: node:${NODE_VERSION}-bookworm
  tags:
    - saas-linux-small-amd64
  parallel:
    matrix:
      - NODE_VERSION: ['22.15.0', '22', '24']
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm-${NODE_VERSION}
    paths:
      - .npm-cache/
  before_script:
    - node --version
    - npm --version
    - npm ci --ignore-scripts --engine-strict --cache .npm-cache --prefer-offline
  script:
    - npm run validate
    - npm run verify:installed
    - node tools/verify-accounting-fixtures.mjs
